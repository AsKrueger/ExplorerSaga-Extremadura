services:
  db:
    image: postgres:15-alpine
    container_name: explorersaga-db
    environment:
      POSTGRES_DB: explorersaga
      POSTGRES_USER: ${DB_USER:-explorersaga_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-explorersaga_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
