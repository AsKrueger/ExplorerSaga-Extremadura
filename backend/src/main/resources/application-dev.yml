# Development configuration
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/explorersaga
    username: explorersaga_user
    password: explorersaga_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.alonso.explorersaga: DEBUG
