# Development configuration
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/explorersaga
    username: explorersaga_user
    password: explorersaga_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

explorersaga:
  providers:
    overpass:
      # Instancias públicas separadas por comas, en orden de preferencia:
      # si la principal está saturada se prueba la siguiente
      base-urls: https://overpass-api.de/api/interpreter,https://overpass.kumi.systems/api/interpreter
      timeout-ms: 30000
      max-attempts: 2
      retry-backoff-ms: 2000

logging:
  level:
    com.alonso.explorersaga: DEBUG
